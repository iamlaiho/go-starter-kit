version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - bodyclose
    - noctx
    - revive
  settings:
    goimports:
      local-prefixes: github.com/iamlaiho/go-starter-kit
    revive:
      rules:
        - name: exported
          disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
